[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrooms-runtime"
version = "0.1.0a1"
description = "Experimental task-oriented workspace runtime for agents"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "KE Studios"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/willykeenan/agentrooms-runtime"
Source = "https://github.com/willykeenan/agentrooms-runtime"
Issues = "https://github.com/willykeenan/agentrooms-runtime/issues"
Demo = "https://huggingface.co/spaces/willykeenan/agentrooms-runtime"

[project.scripts]
agentrooms-runtime = "agentrooms_runtime.__main__:cli"

[tool.setuptools.packages.find]
include = ["agentrooms_runtime*"]
